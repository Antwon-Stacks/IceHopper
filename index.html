<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ice Hopper - Endless Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #0c1427;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 480px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .hud #highScoreDisplay { color: #f59e0b; }
    canvas {
      border: 3px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
      background-color: #0284c7;
      width: 90vw;
      height: 90vw;
      max-width: 480px;
      max-height: 480px;
    }
    .instructions { margin-top: 10px; color: #94a3b8; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Ice Hopper</h1>
  <div class="hud">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="highScoreDisplay">BEST: 0</div>
  </div>

  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <div class="instructions">SWIPE to hop forward, left, right, or back</div>

<script>
// --- HIGH SCORE & GLACIERPLAY BRIDGE ---
const STORAGE_KEY = 'glacierplay_ice_hopper_highscore';
let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
let isNewHighScore = false;

function checkAndUpdateHighScore(currentScore) {
  if (currentScore > highScore) {
    highScore = currentScore;
    isNewHighScore = true;
    localStorage.setItem(STORAGE_KEY, highScore);

    if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
      window.GlacierPlay.onScoreUpdate(currentScore, highScore);
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'GLACIERPLAY_SCORE', game: 'ice_hopper', score: currentScore, highScore: highScore }, '*');
    }
  }
}

// --- WEB AUDIO SYNTHESIZER ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHopSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(480, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function playSplashSound() {
  initAudio();
  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playCrashSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

// --- ENGINE SETUP & VECTOR RENDERERS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 50;
const COLS = 10;
let score = 0;
let maxRow = 0;
let gameOver = false;
let cameraY = 0;
let autoScrollSpeed = 0.25;

const player = {
  col: 4,
  row: 2,
  worldX: 4 * GRID_SIZE,
  worldY: 2 * GRID_SIZE,
  reset() {
    this.col = 4;
    this.row = 2;
    this.worldX = 4 * GRID_SIZE;
    this.worldY = 2 * GRID_SIZE;
  }
};

function drawPenguin(screenX, screenY) {
  const cx = screenX + GRID_SIZE / 2;
  const cy = screenY + GRID_SIZE / 2;

  // Shadow
  ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 18, 16, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Feet
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.ellipse(cx - 8, cy + 16, 5, 3, -0.2, 0, Math.PI * 2);
  ctx.ellipse(cx + 8, cy + 16, 5, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const bodyGrad = ctx.createLinearGradient(cx, cy - 20, cx, cy + 16);
  bodyGrad.addColorStop(0, '#1e293b');
  bodyGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 17, 19, 0, 0, Math.PI * 2);
  ctx.fill();

  // Flippers
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.ellipse(cx - 16, cy + 2, 4, 10, 0.3, 0, Math.PI * 2);
  ctx.ellipse(cx + 16, cy + 2, 4, 10, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 3, 11, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes & Beak
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(cx - 5, cy - 6, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 5, cy - 6, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 7, 1, 0, Math.PI * 2);
  ctx.arc(cx + 4, cy - 7, 1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fb923c';
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy - 3);
  ctx.lineTo(cx + 4, cy - 3);
  ctx.lineTo(cx, cy + 3);
  ctx.closePath();
  ctx.fill();
}

function drawIceFloe(screenX, screenY, width) {
  const height = 36;
  const padY = screenY + 7;

  ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
  ctx.beginPath();
  ctx.roundRect(screenX - 2, padY + 4, width + 4, height, 12);
  ctx.fill();

  const iceGrad = ctx.createLinearGradient(screenX, padY, screenX, padY + height);
  iceGrad.addColorStop(0, '#ffffff');
  iceGrad.addColorStop(0.4, '#e0f2fe');
  iceGrad.addColorStop(1, '#bae6fd');
  ctx.fillStyle = iceGrad;
  ctx.beginPath();
  ctx.roundRect(screenX, padY, width, height, 10);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(screenX + 3, padY + 3, width - 6, height - 6, 8);
  ctx.stroke();
}

function drawShip(screenX, screenY, width, dir) {
  const height = 32;
  const padY = screenY + 9;

  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.beginPath();
  if (dir > 0) ctx.ellipse(screenX - 8, padY + height / 2, 12, 6, 0, 0, Math.PI * 2);
  else ctx.ellipse(screenX + width + 8, padY + height / 2, 12, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const hullGrad = ctx.createLinearGradient(screenX, padY, screenX, padY + height);
  hullGrad.addColorStop(0, '#dc2626');
  hullGrad.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.roundRect(screenX, padY, width, height, [6, 14, 14, 6]);
  ctx.fill();

  const colors = ['#0284c7', '#eab308', '#059669', '#d97706'];
  const blockWidth = 18;
  let count = Math.floor((width - 24) / blockWidth);
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(screenX + 8 + (i * blockWidth), padY + 4, blockWidth - 3, height - 12);
  }

  ctx.fillStyle = '#f8fafc';
  const cabinX = dir > 0 ? screenX + width - 18 : screenX + 4;
  ctx.fillRect(cabinX, padY + 2, 14, height - 8);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(cabinX + 3, padY + 5, 8, 5);
}

// --- PROCEDURAL ROW GENERATOR ---
const generatedRows = new Map();
let lastChunkType = 'SAFE';
let currentChunkLength = 5;

function getOrCreateRow(r) {
  if (generatedRows.has(r)) return generatedRows.get(r);

  let type = 'SAFE';
  let speed = 0;
  let obstacles = [];

  if (r < 4) {
    type = 'SAFE';
  } else {
    currentChunkLength--;
    if (currentChunkLength <= 0) {
      if (lastChunkType === 'SAFE') {
        lastChunkType = Math.random() < 0.5 ? 'ROAD' : 'WATER';
        currentChunkLength = Math.floor(Math.random() * 3) + 2; // 2-4 rows
      } else {
        lastChunkType = 'SAFE';
        currentChunkLength = Math.floor(Math.random() * 2) + 1; // 1-2 safe rows
      }
    }
    type = lastChunkType;

    if (type === 'ROAD' || type === 'WATER') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const speedMult = 1 + Math.min(score / 1500, 1.5); // Speed ramps with score
      speed = dir * (1.5 + Math.random() * 1.5) * speedMult;
      const itemWidthUnits = Math.floor(Math.random() * 2) + 2; // 2 or 3 units wide
      const itemWidth = itemWidthUnits * GRID_SIZE;
      const spacing = itemWidth + 120 + Math.random() * 100;

      for (let x = -200; x < canvas.width + 300; x += spacing) {
        obstacles.push({
          x: x,
          width: itemWidth,
          isPlatform: (type === 'WATER')
        });
      }
    }
  }

  const rowData = { r, type, speed, obstacles };
  generatedRows.set(r, rowData);
  return rowData;
}

// --- INPUT HANDLERS ---
let touchStartX = 0;
let touchStartY = 0;
const MIN_SWIPE_DIST = 25;

function movePlayer(dCol, dRow) {
  if (gameOver) return;

  const nextCol = player.col + dCol;
  const nextRow = player.row + dRow;

  if (nextCol >= 0 && nextCol < COLS) {
    player.col = nextCol;
    player.worldX = player.col * GRID_SIZE;
  }

  if (nextRow >= 0) {
    player.row = nextRow;
    player.worldY = player.row * GRID_SIZE;

    if (player.row > maxRow) {
      maxRow = player.row;
      score = maxRow * 10;
      checkAndUpdateHighScore(score);
    }
  }

  playHopSound();
}

window.addEventListener('touchstart', (e) => {
  initAudio();
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (gameOver) {
    restartGame();
    return;
  }

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) < MIN_SWIPE_DIST && Math.abs(dy) < MIN_SWIPE_DIST) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) movePlayer(1, 0);
    else movePlayer(-1, 0);
  } else {
    if (dy < 0) movePlayer(0, 1);  // Swipe up = hop forward
    else movePlayer(0, -1); // Swipe down = hop back
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (gameOver) {
    if (e.key.toLowerCase() === 'r') restartGame();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, 1);
  if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, -1);
  if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
  if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
});

// --- GAME LOGIC & LOOPS ---
function update() {
  if (gameOver) return;

  // Auto-camera creep (slowly forces player forward)
  autoScrollSpeed = 0.25 + Math.min(score / 2000, 0.5);
  cameraY += autoScrollSpeed;

  // Keep camera locked onto player if they advance far ahead
  const targetCamY = player.worldY - 250;
  if (targetCamY > cameraY) {
    cameraY += (targetCamY - cameraY) * 0.1;
  }

  const playerScreenY = canvas.height - (player.worldY - cameraY) - GRID_SIZE;

  // Check if player falls off the bottom edge of screen
  if (playerScreenY > canvas.height + 10) {
    playSplashSound();
    triggerGameOver();
    return;
  }

  const currentRow = getOrCreateRow(player.row);
  let onPlatform = false;

  // Update obstacles for active rows
  const minVisibleRow = Math.floor(cameraY / GRID_SIZE) - 2;
  const maxVisibleRow = minVisibleRow + 15;

  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    if (rowData.speed !== 0) {
      rowData.obstacles.forEach(obs => {
        obs.x += rowData.speed;

        // Wrap around screen bounds
        if (rowData.speed > 0 && obs.x > canvas.width + 100) obs.x = -obs.width - 50;
        else if (rowData.speed < 0 && obs.x + obs.width < -100) obs.x = canvas.width + 50;

        // Collision Check for player's current row
        if (r === player.row) {
          const overlap = player.worldX < obs.x + obs.width && player.worldX + GRID_SIZE > obs.x;
          if (rowData.type === 'WATER' && overlap) {
            onPlatform = true;
            player.worldX += rowData.speed;
            player.col = Math.round(player.worldX / GRID_SIZE);
          } else if (rowData.type === 'ROAD' && overlap) {
            playCrashSound();
            triggerGameOver();
          }
        }
      });
    }
  }

  // Drown check on water
  if (currentRow.type === 'WATER' && !onPlatform) {
    playSplashSound();
    triggerGameOver();
  }

  // Check left/right screen bounds
  if (player.worldX < 0 || player.worldX + GRID_SIZE > canvas.width) {
    playSplashSound();
    triggerGameOver();
  }
}

function triggerGameOver() {
  gameOver = true;
}

function restartGame() {
  score = 0;
  maxRow = 0;
  cameraY = 0;
  gameOver = false;
  isNewHighScore = false;
  generatedRows.clear();
  lastChunkType = 'SAFE';
  currentChunkLength = 5;
  player.reset();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const minVisibleRow = Math.max(0, Math.floor(cameraY / GRID_SIZE) - 2);
  const maxVisibleRow = minVisibleRow + 14;

  // 1. Draw Terrain Background Rows
  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    const screenY = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;

    if (rowData.type === 'SAFE') {
      ctx.fillStyle = (r % 2 === 0) ? '#f1f5f9' : '#e2e8f0';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE);
    } else if (rowData.type === 'WATER') {
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE);
    } else if (rowData.type === 'ROAD') {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE);
    }
  }

  // 2. Draw Obstacles
  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    const screenY = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;

    rowData.obstacles.forEach(obs => {
      if (rowData.type === 'WATER') {
        drawIceFloe(obs.x, screenY, obs.width);
      } else if (rowData.type === 'ROAD') {
        drawShip(obs.x, screenY, obs.width, rowData.speed);
      }
    });
  }

  // 3. Draw Player Penguin
  const playerScreenX = player.worldX;
  const playerScreenY = canvas.height - (player.worldY - cameraY) - GRID_SIZE;
  drawPenguin(playerScreenX, playerScreenY);

  // 4. Update HUD
  document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
  document.getElementById('highScoreDisplay').innerText = `BEST: ${highScore}`;

  // 5. Game Over Screen
  if (gameOver) {
    ctx.fillStyle = 'rgba(12, 20, 39, 0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ef4444';
    ctx.font = '800 28px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, 200);

    if (isNewHighScore) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = '700 20px system-ui, sans-serif';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 245);
    }

    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, isNewHighScore ? 280 : 255);
    ctx.fillText('TAP ANYWHERE TO RESTART', canvas.width / 2, 320);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
