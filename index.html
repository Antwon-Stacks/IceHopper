<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ice Hopper - GlacierPlay</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0c1427; font-family: system-ui, -apple-system, sans-serif; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; }
    
    /* UI Overlays */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: rgba(12, 20, 39, 0.85); backdrop-filter: blur(8px); transition: opacity 0.3s; }
    .hidden { opacity: 0; pointer-events: none; }
    
    h1 { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(135deg, #e0f2fe, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.4)); }
    .stats { color: #f8fafc; font-size: 18px; font-weight: 700; margin-bottom: 30px; text-align: center; line-height: 1.5; }
    .stats span { color: #f59e0b; }
    .stats .fish { color: #38bdf8; }
    
    button { background: linear-gradient(to bottom, #38bdf8, #0284c7); border: none; border-radius: 30px; padding: 15px 40px; color: white; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5); cursor: pointer; transition: transform 0.1s; margin-bottom: 15px; width: 220px; }
    button:active { transform: scale(0.95); }
    button.alt { background: linear-gradient(to bottom, #475569, #1e293b); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
    
    /* In-Game HUD */
    .hud { position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px; display: flex; justify-content: space-between; padding: 10px 18px; background: rgba(12, 20, 39, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: white; font-weight: 800; z-index: 10; pointer-events: none; }
    .hud-left { display: flex; gap: 15px; }
    .hud-fish { color: #38bdf8; }
    .powerup-bar { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; display: none; z-index: 10; }
    .powerup-fill { height: 100%; background: #f59e0b; width: 100%; transition: width 0.1s linear; }

    /* Shop UI */
    #shop { display: none; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; }
    .skin-card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; width: 280px; border: 2px solid transparent; }
    .skin-card.active { border-color: #38bdf8; }
    .skin-info { color: white; font-weight: bold; }
    .skin-cost { color: #38bdf8; font-size: 14px; }
    .skin-btn { width: auto; padding: 10px 20px; font-size: 14px; margin: 0; }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="startMenu" class="overlay">
    <h1>Ice Hopper</h1>
    <div class="stats">
      BEST SCORE: <span id="menuBest">0</span><br>
      FISH VAULT: <span class="fish" id="menuFish">0</span> 🐟
    </div>
    <button onclick="startGame()">Tap to Hop</button>
    <button class="alt" onclick="openShop()">Skins Shop</button>
  </div>

  <!-- Shop Menu -->
  <div id="shop" class="overlay">
    <h1 style="font-size: 28px;">Skin Shop</h1>
    <div class="stats">FISH: <span class="fish" id="shopFish">0</span> 🐟</div>
    <div id="skinList"></div>
    <button class="alt" onclick="closeShop()" style="margin-top: 20px;">Back</button>
  </div>

  <!-- In-Game HUD -->
  <div class="hud" id="gameHud" style="opacity: 0;">
    <div class="hud-left">
      <div>SCORE: <span id="scoreDisplay">0</span></div>
      <div class="hud-fish" id="fishDisplay">🐟 0</div>
    </div>
    <div id="statusDisplay"></div>
  </div>
  <div class="powerup-bar" id="powerupBar"><div class="powerup-fill" id="powerupFill"></div></div>

  <canvas id="gameCanvas"></canvas>

<script>
// --- LOCAL STORAGE & PROGRESSION ---
const KEY_HIGH = 'glacierplay_icehopper_high';
const KEY_FISH = 'glacierplay_icehopper_fish';
const KEY_SKINS = 'glacierplay_icehopper_skins';
const KEY_EQUIP = 'glacierplay_icehopper_equip';

let highScore = parseInt(localStorage.getItem(KEY_HIGH)) || 0;
let fishCoins = parseInt(localStorage.getItem(KEY_FISH)) || 0;
let unlockedSkins = JSON.parse(localStorage.getItem(KEY_SKINS)) || ['default'];
let currentSkin = localStorage.getItem(KEY_EQUIP) || 'default';

const SKINS = [
  { id: 'default', name: 'Classic', cost: 0, color: '#0f172a', beak: '#f97316' },
  { id: 'puffin', name: 'Puffin', cost: 50, color: '#1e293b', beak: '#ef4444' },
  { id: 'cool', name: 'Cool Guy', cost: 150, color: '#0f172a', beak: '#f97316', glasses: true }
];

function saveProgress() {
  localStorage.setItem(KEY_HIGH, highScore);
  localStorage.setItem(KEY_FISH, fishCoins);
  localStorage.setItem(KEY_SKINS, JSON.stringify(unlockedSkins));
  localStorage.setItem(KEY_EQUIP, currentSkin);
  document.getElementById('menuBest').innerText = highScore;
  document.getElementById('menuFish').innerText = fishCoins;
}
saveProgress();

function checkAndUpdateHighScore(currentScore) {
  if (currentScore > highScore) {
    highScore = currentScore;
    localStorage.setItem(KEY_HIGH, highScore);
    if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
      window.GlacierPlay.onScoreUpdate(currentScore, highScore);
    }
  }
}

// --- AUDIO & HAPTICS ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function playSound(type) {
  initAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'hop') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1); vibrate(10);
  } else if (type === 'coin') {
    osc.type = 'square'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1200, t + 0.05);
    gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    osc.start(t); osc.stop(t + 0.15); vibrate([10, 30, 10]);
  } else if (type === 'powerup') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t + 0.3);
    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3); vibrate(50);
  } else if (type === 'crash' || type === 'splash') {
    osc.type = type === 'crash' ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3); vibrate(80);
  }
}

// --- ENGINE & CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let GRID_SIZE = 50, COLS = 10;

function resize() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  GRID_SIZE = canvas.width / COLS;
}
window.addEventListener('resize', resize); resize();

let gameState = 'START'; 
let score = 0, maxRow = 2, cameraY = 0, autoScrollSpeed = 0;
let particles = [];
let powerupTimer = 0;
let hasShield = false;

// --- VISUAL ASSETS (SVG Data URIs) ---
const svgToImg = (svg) => { const img = new Image(); img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg); return img; };

// NEW ICE FLOE: Added glaring white streaks and sparkles to indicate it is "slippery"
const iceImg = svgToImg(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <path d="M14,18 C32,8 168,8 186,18 C194,36 188,68 174,78 C144,88 56,88 26,78 C12,68 6,36 14,18 Z" fill="#e0f2fe"/>
  <path d="M22,25 C40,15 160,15 178,25 C186,40 180,65 166,75 C140,85 60,85 34,75 C20,65 14,40 22,25 Z" fill="#bae6fd"/>
  <!-- Glossy Slippery Streaks -->
  <path d="M 40,30 L 90,30 M 130,30 L 160,30 M 50,50 L 150,50 M 70,70 L 120,70" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 60,40 L 80,40 M 110,60 L 140,60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Shine Sparkles -->
  <path d="M 140,25 L 140,15 M 135,20 L 145,20" stroke="#ffffff" stroke-width="2"/>
  <path d="M 50,60 L 50,50 M 45,55 L 55,55" stroke="#ffffff" stroke-width="2"/>
</svg>`);

const shipImg = svgToImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100"><path d="M8,48 L282,48 L295,68 C290,82 270,86 250,86 L40,86 C20,86 8,76 8,48 Z" fill="#7f1d1d"/><path d="M4,38 L286,38 L291,50 L8,50 Z" fill="#dc2626"/><rect x="22" y="16" width="46" height="22" fill="#0284c7"/><rect x="74" y="16" width="46" height="22" fill="#eab308"/><rect x="126" y="16" width="46" height="22" fill="#059669"/><rect x="212" y="8" width="36" height="30" rx="3" fill="#f8fafc"/><rect x="216" y="13" width="28" height="9" fill="#38bdf8"/></svg>`);

// --- CLASSES ---
class Player {
  constructor() { this.reset(); }
  reset() {
    this.col = 4; this.row = 2; // Player starts at row 2
    this.x = this.col * GRID_SIZE; this.y = this.row * GRID_SIZE;
    this.animX = this.x; this.animY = this.y;
    this.hopT = 1; this.isDead = false;
  }
  hop(dCol, dRow) {
    if (this.hopT < 0.8 || this.isDead) return;
    this.col = Math.max(0, Math.min(COLS - 1, this.col + dCol));
    this.row = Math.max(0, this.row + dRow);
    this.x = this.col * GRID_SIZE;
    this.y = this.row * GRID_SIZE;
    this.hopT = 0;
    playSound('hop');
    spawnParticles(this.animX + GRID_SIZE/2, canvas.height - (this.animY - cameraY), '#e2e8f0', 5);
    
    // SCORE KEEPER
    if (this.row > maxRow) {
      maxRow = this.row; 
      score = (maxRow - 2) * 10;
      checkAndUpdateHighScore(score);
      updateHUD(); 
    }
  }
  update(dt) {
    if (this.hopT < 1) {
      this.hopT += dt * 6; // Animation speed
      if (this.hopT > 1) this.hopT = 1;
      this.animX += (this.x - this.animX) * 0.4;
      this.animY += (this.y - this.animY) * 0.4;
    } else {
      this.animX = this.x; this.animY = this.y;
    }
  }
  
  draw(ctx, screenY) {
    if (this.isDead) return;
    const skin = SKINS.find(s => s.id === currentSkin);
    const cx = this.animX + GRID_SIZE / 2;
    const cy = screenY + GRID_SIZE / 2;
    
    // Powerup Aura
    if (powerupTimer > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, GRID_SIZE*0.7, 0, Math.PI*2);
      ctx.fillStyle = `rgba(245, 158, 11, ${0.3 + Math.sin(Date.now()/50)*0.2})`; ctx.fill();
    } else if (hasShield) {
      ctx.beginPath(); ctx.arc(cx, cy, GRID_SIZE*0.6, 0, Math.PI*2);
      ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 3; ctx.stroke();
    }

    ctx.save();
    ctx.translate(cx, cy);
    
    // Squash & Stretch
    if (this.hopT < 1) {
      const arc = Math.sin(this.hopT * Math.PI);
      ctx.translate(0, -arc * (GRID_SIZE * 0.4));
      ctx.scale(1 - arc * 0.15, 1 + arc * 0.2);
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0, 16, 14, 4, 0, 0, Math.PI*2); ctx.fill();
    
    // 1. Side Flippers
    ctx.fillStyle = skin.color;
    ctx.beginPath(); ctx.ellipse(-14, 2, 4, 10, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 2, 4, 10, -0.5, 0, Math.PI*2); ctx.fill();

    // 2. Orange Feet
    ctx.fillStyle = skin.beak;
    ctx.beginPath(); ctx.ellipse(-8, 14, 5, 3, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, 14, 5, 3, 0.2, 0, Math.PI*2); ctx.fill();

    // 3. Pear-Shaped Body
    ctx.fillStyle = skin.color;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.bezierCurveTo(-14, -16, -18, -2, -15, 10);
    ctx.bezierCurveTo(-8, 18, 8, 18, 15, 10);
    ctx.bezierCurveTo(18, -2, 14, -16, 0, -16);
    ctx.fill();

    // 4. White Face Mask & Belly
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-5, -6, 6, 0, Math.PI*2); ctx.arc(5, -6, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 6, 11, 8, 0, 0, Math.PI*2); ctx.fill();

    // 5. Beak
    ctx.beginPath();
    if (skin.id === 'puffin') {
        ctx.fillStyle = '#ef4444'; ctx.moveTo(-6, -2); ctx.lineTo(6, -2); ctx.lineTo(0, 6); ctx.fill();
        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(6, -2); ctx.lineTo(0, 0); ctx.fill();
    } else {
        ctx.fillStyle = skin.beak; ctx.moveTo(-5, -2); ctx.lineTo(5, -2); ctx.lineTo(0, 4); ctx.fill();
    }

    // 6. Eyes & Shine
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-5, -6, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -6, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-6, -7, 0.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -7, 0.8, 0, Math.PI*2); ctx.fill();

    // 7. Cool Guy Glasses
    if (skin.glasses) {
      ctx.fillStyle = '#111';
      ctx.fillRect(-12, -10, 24, 6); ctx.fillRect(-1, -10, 2, 6);
      ctx.beginPath(); ctx.moveTo(-12, -4); ctx.lineTo(-2, -4); ctx.lineTo(-4, 0); ctx.lineTo(-10, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2, -4); ctx.lineTo(12, -4); ctx.lineTo(10, 0); ctx.lineTo(4, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-10, -9, 3, 3); ctx.fillRect(4, -9, 3, 3);
    }
    ctx.restore();
  }
}

const player = new Player();
const generatedRows = new Map();

// --- MAP GENERATION (Progressive Difficulty) ---
function getOrCreateRow(r) {
  if (generatedRows.has(r)) return generatedRows.get(r);

  const diff = Math.min(1, maxRow / 100); 
  let type = 'SAFE', speed = 0, obstacles = [], items = [];

  if (r > 3) {
    const rand = Math.random();
    if (r < 10) type = rand < 0.6 ? 'ROAD' : 'SAFE'; 
    else if (r < 30) type = rand < 0.4 ? 'ROAD' : (rand < 0.8 ? 'WATER' : 'SAFE'); 
    else type = rand < 0.4 ? 'ROAD' : (rand < 0.85 ? 'WATER' : 'SAFE'); 

    // Spawn Obstacles
    if (type !== 'SAFE') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      speed = dir * (1.5 + Math.random() * 2) * (1 + diff);
      const isOrca = type === 'WATER' && diff > 0.4 && Math.random() < 0.3; 
      const width = (Math.floor(Math.random() * 2) + 2) * GRID_SIZE;
      const spacing = width + (GRID_SIZE * 2.5) + Math.random() * (GRID_SIZE * 2) * (1 - diff*0.5);

      for (let x = -300; x < canvas.width + 400; x += spacing) {
        obstacles.push({ x, width, isMelting: type === 'WATER' && !isOrca && diff > 0.3 && Math.random() < 0.3, meltTimer: 0, isOrca });
      }
    }

    // Spawn Items
    if (Math.random() < 0.15) {
      const ix = Math.floor(Math.random() * COLS) * GRID_SIZE;
      const itemType = Math.random() < 0.05 ? 'SARDINE' : (Math.random() < 0.1 ? 'SHIELD' : 'FISH');
      items.push({ x: ix, type: itemType, collected: false });
    }
  }

  const rowData = { r, type, speed, obstacles, items };
  generatedRows.set(r, rowData);
  return rowData;
}

// --- PARTICLES ---
function spawnParticles(x, y, color, count) {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 2,
      life: 1, color, size: Math.random()*4 + 2
    });
  }
}

// --- INPUTS ---
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => { initAudio(); touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive: false});
window.addEventListener('touchend', e => {
  if (gameState !== 'PLAY') return;
  const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) player.hop(dx > 0 ? 1 : -1, 0); else player.hop(0, dy < 0 ? 1 : -1);
}, {passive: false});
window.addEventListener('keydown', e => {
  if (gameState !== 'PLAY') return;
  if(e.key==='ArrowUp'||e.key==='w') player.hop(0,1); if(e.key==='ArrowDown'||e.key==='s') player.hop(0,-1);
  if(e.key==='ArrowLeft'||e.key==='a') player.hop(-1,0); if(e.key==='ArrowRight'||e.key==='d') player.hop(1,0);
});

// --- MENU LOGIC ---
function startGame() {
  document.getElementById('startMenu').classList.add('hidden');
  document.getElementById('gameHud').style.opacity = 1;
  gameState = 'PLAY'; score = 0; maxRow = 2; cameraY = 0; powerupTimer = 0; hasShield = false;
  generatedRows.clear(); player.reset();
  updateHUD();
}
function openShop() {
  document.getElementById('startMenu').classList.add('hidden');
  document.getElementById('shop').style.display = 'flex';
  document.getElementById('shopFish').innerText = fishCoins;
  renderShop();
}
function closeShop() {
  document.getElementById('shop').style.display = 'none';
  document.getElementById('startMenu').classList.remove('hidden');
  saveProgress();
}
function renderShop() {
  const list = document.getElementById('skinList'); list.innerHTML = '';
  SKINS.forEach(s => {
    const isUnlocked = unlockedSkins.includes(s.id);
    const isEquipped = currentSkin === s.id;
    const div = document.createElement('div');
    div.className = `skin-card ${isEquipped ? 'active' : ''}`;
    div.innerHTML = `
      <div><div class="skin-info">${s.name}</div>${!isUnlocked ? `<div class="skin-cost">🐟 ${s.cost}</div>` : ''}</div>
      <button class="skin-btn ${isEquipped ? 'alt' : ''}" onclick="buySkin('${s.id}')">${isEquipped ? 'Equipped' : (isUnlocked ? 'Equip' : 'Buy')}</button>
    `;
    list.appendChild(div);
  });
}
function buySkin(id) {
  const skin = SKINS.find(s => s.id === id);
  if (!unlockedSkins.includes(id)) {
    if (fishCoins >= skin.cost) { fishCoins -= skin.cost; unlockedSkins.push(id); currentSkin = id; playSound('coin'); }
    else { vibrate([50, 50, 50]); return; } 
  } else { currentSkin = id; }
  renderShop(); document.getElementById('shopFish').innerText = fishCoins;
}
function triggerGameOver() {
  gameState = 'OVER'; player.isDead = true; saveProgress();
  setTimeout(() => { document.getElementById('startMenu').classList.remove('hidden'); document.getElementById('gameHud').style.opacity = 0; }, 1000);
}
function updateHUD() {
  document.getElementById('scoreDisplay').innerText = score;
  document.getElementById('fishDisplay').innerText = `🐟 ${fishCoins}`;
  document.getElementById('statusDisplay').innerText = hasShield ? '🛡️' : '';
}

// --- MAIN LOOP ---
let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000; lastTime = time;
  
  if (gameState === 'PLAY') {
    player.update(dt);
    
    // Auto Scroll
    autoScrollSpeed = 0.25 + Math.min(score / 2000, 0.6);
    cameraY += autoScrollSpeed;
    const targetCam = player.animY - canvas.height * 0.4;
    if (targetCam > cameraY) cameraY += (targetCam - cameraY) * 0.1;

    const screenY = canvas.height - (player.animY - cameraY) - GRID_SIZE;
    if (screenY > canvas.height + 20) { playSound('splash'); spawnParticles(player.animX, canvas.height, '#38bdf8', 20); triggerGameOver(); }

    // Powerups
    if (powerupTimer > 0) {
      powerupTimer -= dt;
      document.getElementById('powerupBar').style.display = 'block';
      document.getElementById('powerupFill').style.width = `${(powerupTimer/4)*100}%`;
      spawnParticles(player.animX + GRID_SIZE/2, screenY + GRID_SIZE, '#f59e0b', 1); 
      if (powerupTimer <= 0) document.getElementById('powerupBar').style.display = 'none';
    }

    let onPlatform = false;
    const curRow = getOrCreateRow(player.row);

    // Obstacle Logic
    for (let r = Math.floor(cameraY / GRID_SIZE) - 2; r <= Math.ceil(canvas.height / GRID_SIZE) + Math.floor(cameraY / GRID_SIZE) + 2; r++) {
      const row = getOrCreateRow(r);
      
      // Update Items
      row.items.forEach(item => {
        if (!item.collected && r === player.row && Math.abs(player.animX - item.x) < GRID_SIZE/2) {
          item.collected = true;
          if (item.type === 'FISH') { fishCoins++; score+=10; playSound('coin'); spawnParticles(item.x, canvas.height - (r*GRID_SIZE-cameraY), '#38bdf8', 5); }
          else if (item.type === 'SARDINE') { powerupTimer = 4; playSound('powerup'); }
          else if (item.type === 'SHIELD') { hasShield = true; playSound('powerup'); }
          updateHUD();
        }
      });

      // Update Obstacles
      if (row.speed !== 0) {
        row.obstacles.forEach(obs => {
          obs.x += row.speed;
          if (row.speed > 0 && obs.x > canvas.width + 200) obs.x = -obs.width - 100;
          else if (row.speed < 0 && obs.x + obs.width < -200) obs.x = canvas.width + 100;

          // Collision
          if (r === player.row) {
            const overlap = player.animX < obs.x + obs.width - 10 && player.animX + GRID_SIZE > obs.x + 10;
            if (row.type === 'WATER' && overlap) {
              if (obs.isOrca) {
                if (powerupTimer > 0) { /* invincible */ } 
                else if (hasShield) { hasShield = false; player.hop(0, -1); playSound('crash'); updateHUD(); }
                else { playSound('splash'); spawnParticles(player.animX, screenY, '#ef4444', 20); triggerGameOver(); }
              } else {
                onPlatform = true;
                player.x += row.speed; player.animX += row.speed; player.col = Math.round(player.x / GRID_SIZE);
                if (obs.isMelting && player.hopT === 1) obs.meltTimer += dt;
              }
            } else if (row.type === 'ROAD' && overlap) {
              if (powerupTimer > 0) { obs.x = -1000; spawnParticles(player.animX, screenY, '#f8fafc', 10); playSound('crash'); }
              else if (hasShield) { hasShield = false; player.hop(0, -1); playSound('crash'); updateHUD(); }
              else { playSound('crash'); spawnParticles(player.animX, screenY, '#ef4444', 20); triggerGameOver(); }
            }
          }
          if (obs.isMelting && obs.meltTimer > 1.5) obs.x = -1000; 
        });
      }
    }

    if (curRow.type === 'WATER' && !onPlatform && player.hopT === 1) { playSound('splash'); spawnParticles(player.animX, screenY, '#38bdf8', 20); triggerGameOver(); }
    if (player.animX < -GRID_SIZE/2 || player.animX > canvas.width - GRID_SIZE/2) { playSound('splash'); triggerGameOver(); }
  }

  // --- RENDER ---
  const cycle = (maxRow / 100) % 1;
  let bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  if (cycle < 0.3) { bgGrad.addColorStop(0, '#38bdf8'); bgGrad.addColorStop(1, '#e0f2fe'); }
  else if (cycle < 0.6) { bgGrad.addColorStop(0, '#f43f5e'); bgGrad.addColorStop(1, '#fcd34d'); }
  else if (cycle < 0.8) { bgGrad.addColorStop(0, '#0f172a'); bgGrad.addColorStop(1, '#312e81'); }
  else { bgGrad.addColorStop(0, '#064e3b'); bgGrad.addColorStop(1, '#10b981'); } 
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const minR = Math.max(0, Math.floor(cameraY / GRID_SIZE) - 1);
  const maxR = minR + Math.ceil(canvas.height / GRID_SIZE) + 2;

  for (let r = minR; r <= maxR; r++) {
    const row = getOrCreateRow(r);
    const sy = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;
    
    // NEW: Both Water and Ship Lanes use the exact same continuous Water color
    if (row.type === 'SAFE') { 
        ctx.fillStyle = (r%2===0)?'#f1f5f9':'#e2e8f0'; 
        ctx.fillRect(0, sy, canvas.width, GRID_SIZE+1); 
    }
    else if (row.type === 'WATER' || row.type === 'ROAD') { 
        ctx.fillStyle = '#0284c7'; 
        ctx.fillRect(0, sy, canvas.width, GRID_SIZE+1); 
    }

    ctx.font = `${GRID_SIZE*0.6}px sans-serif`; ctx.textAlign = 'center';
    row.items.forEach(i => {
      if (!i.collected) {
        const floatY = Math.sin(Date.now()/200)*3;
        ctx.fillText(i.type==='FISH'?'🐟':(i.type==='SARDINE'?'🌟':'🛡️'), i.x + GRID_SIZE/2, sy + GRID_SIZE*0.7 + floatY);
      }
    });

    row.obstacles.forEach(obs => {
      if (row.type === 'WATER') {
        if (obs.isOrca) {
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, sy + GRID_SIZE/2, obs.width/2, 10, 0, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(obs.x + obs.width/2, sy + GRID_SIZE/2); ctx.lineTo(obs.x + obs.width/2 - (row.speed>0?15:-15), sy - 15); ctx.lineTo(obs.x + obs.width/2 + (row.speed>0?10:-10), sy + GRID_SIZE/2); ctx.fill();
        } else {
          ctx.globalAlpha = obs.isMelting ? Math.max(0, 1 - (obs.meltTimer/1.5)) : 1;
          if (obs.isMelting && Math.random()<0.2) ctx.translate((Math.random()-0.5)*4, 0); 
          ctx.drawImage(iceImg, obs.x, sy, obs.width, GRID_SIZE);
          ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
        }
      } else if (row.type === 'ROAD') {
        
        // NEW: Draw Ship V-Wake foaming behind the ship
        const wakeTime = performance.now() / 150;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        const wakeDir = row.speed > 0 ? -1 : 1;
        const wakeStartX = row.speed > 0 ? obs.x + 5 : obs.x + obs.width - 5;
        for(let i=0; i<6; i++) {
            let phase = (wakeTime - i * 0.6) % 4;
            if (phase < 0) phase += 4;
            let wx = wakeStartX + wakeDir * (phase * 15);
            let rSize = 2 + phase * 1.8;
            let spread = phase * 4;
            ctx.beginPath(); ctx.arc(wx, sy + GRID_SIZE/2 - spread, rSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(wx, sy + GRID_SIZE/2 + spread, rSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(wx, sy + GRID_SIZE/2, rSize * 1.4, 0, Math.PI*2); ctx.fill();
        }

        // Draw Ship
        ctx.save();
        if (row.speed < 0) { ctx.translate(obs.x + obs.width, sy); ctx.scale(-1, 1); ctx.drawImage(shipImg, 0, -4, obs.width, GRID_SIZE + 8); }
        else { ctx.drawImage(shipImg, obs.x, sy - 4, obs.width, GRID_SIZE + 8); }
        ctx.restore();
      }
    });
  }

  player.draw(ctx, canvas.height - (player.animY - cameraY) - GRID_SIZE);
  
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life -= dt*2;
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  });
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
