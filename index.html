<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ice Hopper - GlacierPlay</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c1427;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color: #0284c7;
    }
    /* Floating Glassmorphic Mobile HUD */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(12, 20, 39, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: #f8fafc;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 10;
    }
    .hud #highScoreDisplay {
      color: #f59e0b;
    }
    .instructions-overlay {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 24px);
      width: 100%;
      text-align: center;
      color: rgba(248, 250, 252, 0.6);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="highScoreDisplay">BEST: 0</div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div class="instructions-overlay">Swipe to Hop</div>

<script>
// --- HIGH SCORE & GLACIERPLAY BRIDGE ---
const STORAGE_KEY = 'glacierplay_ice_hopper_highscore';
let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
let isNewHighScore = false;

function checkAndUpdateHighScore(currentScore) {
  if (currentScore > highScore) {
    highScore = currentScore;
    isNewHighScore = true;
    localStorage.setItem(STORAGE_KEY, highScore);

    if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
      window.GlacierPlay.onScoreUpdate(currentScore, highScore);
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'GLACIERPLAY_SCORE', game: 'ice_hopper', score: currentScore, highScore: highScore }, '*');
    }
  }
}

// --- WEB AUDIO SYNTHESIZER ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHopSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(480, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function playSplashSound() {
  initAudio();
  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playCrashSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

// --- HIGH-DETAIL SVG ASSETS (EMBEDDED DATA URIs) ---
const svgToImg = (svg) => {
  const img = new Image();
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  return img;
};

// 1. Detailed Ice Floe SVG
const iceFloeImg = svgToImg(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <!-- Underwater Ice Shelf -->
  <path d="M8,25 C25,12 175,12 192,25 C200,45 195,78 180,88 C150,98 50,98 20,88 C5,78 0,45 8,25 Z" fill="#38bdf8" opacity="0.45"/>
  <!-- Top Surface -->
  <path d="M14,18 C32,8 168,8 186,18 C194,36 188,68 174,78 C144,88 56,88 26,78 C12,68 6,36 14,18 Z" fill="url(#iceGrad)"/>
  <!-- Snow Cap Drift -->
  <path d="M28,20 C50,14 100,16 125,22 C90,28 45,26 28,20 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Surface Cracks -->
  <path d="M65,35 L85,50 L80,65 M85,50 L105,45" stroke="#0284c7" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M130,22 L145,38 L160,32" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>`);

// 2. Detailed Cargo Ship SVG
const shipImg = svgToImg(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Bow/Stern Water Spray -->
  <ellipse cx="285" cy="72" rx="14" ry="6" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="15" cy="72" rx="10" ry="5" fill="#ffffff" opacity="0.3"/>
  <!-- Lower Steel Hull -->
  <path d="M8,48 L282,48 L295,68 C290,82 270,86 250,86 L40,86 C20,86 8,76 8,48 Z" fill="#7f1d1d"/>
  <!-- Upper Hull Stripe -->
  <path d="M4,38 L286,38 L291,50 L8,50 Z" fill="#dc2626"/>
  <line x1="4" y1="44" x2="288" y2="44" stroke="#b91c1c" stroke-width="1.5"/>
  <!-- Stacked Cargo Containers -->
  <rect x="22" y="16" width="46" height="22" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <line x1="33" y1="16" x2="33" y2="38" stroke="#0369a1"/>
  <line x1="45" y1="16" x2="45" y2="38" stroke="#0369a1"/>
  <line x1="57" y1="16" x2="57" y2="38" stroke="#0369a1"/>

  <rect x="74" y="16" width="46" height="22" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="85" y1="16" x2="85" y2="38" stroke="#ca8a04"/>
  <line x1="97" y1="16" x2="97" y2="38" stroke="#ca8a04"/>
  <line x1="109" y1="16" x2="109" y2="38" stroke="#ca8a04"/>

  <rect x="126" y="16" width="46" height="22" rx="2" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <line x1="137" y1="16" x2="137" y2="38" stroke="#047857"/>
  <line x1="149" y1="16" x2="149" y2="38" stroke="#047857"/>
  <line x1="161" y1="16" x2="161" y2="38" stroke="#047857"/>

  <!-- Upper Tier Containers -->
  <rect x="48" y="-4" width="46" height="20" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <rect x="100" y="-4" width="46" height="20" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Bridge / Navigation Cabin -->
  <rect x="212" y="8" width="36" height="30" rx="3" fill="#f8fafc"/>
  <rect x="216" y="13" width="28" height="9" rx="1.5" fill="#38bdf8"/>
  <rect x="225" y="-4" width="10" height="12" fill="#0f172a"/>
  <rect x="223" y="-7" width="14" height="3" fill="#dc2626"/>
  <!-- Exhaust Steam -->
  <circle cx="221" cy="-14" r="4" fill="#f8fafc" opacity="0.6"/>
  <circle cx="215" cy="-20" r="6" fill="#f8fafc" opacity="0.3"/>
</svg>`);

// 3. Detailed Penguin SVG
const penguinImg = svgToImg(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <ellipse cx="50" cy="88" rx="32" ry="10" fill="#000000" opacity="0.3"/>
  <ellipse cx="32" cy="82" rx="10" ry="6" fill="#f97316"/>
  <ellipse cx="68" cy="82" rx="10" ry="6" fill="#f97316"/>
  <path d="M50,10 C25,10 18,35 18,60 C18,80 32,85 50,85 C68,85 82,80 82,60 C82,35 75,10 50,10 Z" fill="#0f172a"/>
  <ellipse cx="16" cy="52" rx="7" ry="18" transform="rotate(15, 16, 52)" fill="#0f172a"/>
  <ellipse cx="84" cy="52" rx="7" ry="18" transform="rotate(-15, 84, 52)" fill="#0f172a"/>
  <path d="M50,28 C35,28 30,48 30,62 C30,78 38,81 50,81 C62,81 70,78 70,62 C70,48 65,28 50,28 Z" fill="#ffffff"/>
  <ellipse cx="36" cy="40" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="64" cy="40" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>
  <circle cx="38" cy="34" r="5" fill="#0f172a"/>
  <circle cx="62" cy="34" r="5" fill="#0f172a"/>
  <circle cx="36" cy="32" r="2" fill="#ffffff"/>
  <circle cx="60" cy="32" r="2" fill="#ffffff"/>
  <path d="M43,40 Q50,38 57,40 Q50,52 43,40 Z" fill="#fb923c"/>
</svg>`);

// --- FULL-SCREEN CANVAS & ENGINE SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let GRID_SIZE = 50;
const COLS = 10;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  GRID_SIZE = canvas.width / COLS; // Responsive 10-column grid scaling
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let score = 0;
let maxRow = 0;
let gameOver = false;
let cameraY = 0;
let autoScrollSpeed = 0.25;

const player = {
  col: 4,
  row: 2,
  worldX: 4 * GRID_SIZE,
  worldY: 2 * GRID_SIZE,
  reset() {
    this.col = 4;
    this.row = 2;
    this.worldX = 4 * GRID_SIZE;
    this.worldY = 2 * GRID_SIZE;
  }
};

// --- PROCEDURAL WORLD GENERATION ---
const generatedRows = new Map();
let lastChunkType = 'SAFE';
let currentChunkLength = 5;

function getOrCreateRow(r) {
  if (generatedRows.has(r)) return generatedRows.get(r);

  let type = 'SAFE';
  let speed = 0;
  let obstacles = [];

  if (r < 4) {
    type = 'SAFE';
  } else {
    currentChunkLength--;
    if (currentChunkLength <= 0) {
      if (lastChunkType === 'SAFE') {
        lastChunkType = Math.random() < 0.5 ? 'ROAD' : 'WATER';
        currentChunkLength = Math.floor(Math.random() * 3) + 2;
      } else {
        lastChunkType = 'SAFE';
        currentChunkLength = Math.floor(Math.random() * 2) + 1;
      }
    }
    type = lastChunkType;

    if (type === 'ROAD' || type === 'WATER') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const speedMult = 1 + Math.min(score / 1500, 1.5);
      speed = dir * (1.5 + Math.random() * 1.5) * speedMult;
      const itemWidthUnits = Math.floor(Math.random() * 2) + 2;
      const itemWidth = itemWidthUnits * GRID_SIZE;
      const spacing = itemWidth + (GRID_SIZE * 2.5) + Math.random() * (GRID_SIZE * 2);

      for (let x = -300; x < canvas.width + 400; x += spacing) {
        obstacles.push({ x: x, width: itemWidth });
      }
    }
  }

  const rowData = { r, type, speed, obstacles };
  generatedRows.set(r, rowData);
  return rowData;
}

// --- CONTROLS ---
let touchStartX = 0;
let touchStartY = 0;
const MIN_SWIPE_DIST = 20;

function movePlayer(dCol, dRow) {
  if (gameOver) return;

  const nextCol = player.col + dCol;
  const nextRow = player.row + dRow;

  if (nextCol >= 0 && nextCol < COLS) {
    player.col = nextCol;
    player.worldX = player.col * GRID_SIZE;
  }

  if (nextRow >= 0) {
    player.row = nextRow;
    player.worldY = player.row * GRID_SIZE;

    if (player.row > maxRow) {
      maxRow = player.row;
      score = maxRow * 10;
      checkAndUpdateHighScore(score);
    }
  }

  playHopSound();
}

window.addEventListener('touchstart', (e) => {
  initAudio();
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (gameOver) {
    restartGame();
    return;
  }

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) < MIN_SWIPE_DIST && Math.abs(dy) < MIN_SWIPE_DIST) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) movePlayer(1, 0);
    else movePlayer(-1, 0);
  } else {
    if (dy < 0) movePlayer(0, 1);
    else movePlayer(0, -1);
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (gameOver) {
    if (e.key.toLowerCase() === 'r') restartGame();
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, 1);
  if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, -1);
  if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
  if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
});

// --- ENGINE UPDATE & LOOP ---
function update() {
  if (gameOver) return;

  autoScrollSpeed = 0.25 + Math.min(score / 2000, 0.55);
  cameraY += autoScrollSpeed;

  const targetCamY = player.worldY - (canvas.height * 0.45);
  if (targetCamY > cameraY) {
    cameraY += (targetCamY - cameraY) * 0.12;
  }

  const playerScreenY = canvas.height - (player.worldY - cameraY) - GRID_SIZE;

  if (playerScreenY > canvas.height + 20) {
    playSplashSound();
    triggerGameOver();
    return;
  }

  const currentRow = getOrCreateRow(player.row);
  let onPlatform = false;

  const minVisibleRow = Math.floor(cameraY / GRID_SIZE) - 2;
  const maxVisibleRow = minVisibleRow + Math.ceil(canvas.height / GRID_SIZE) + 3;

  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    if (rowData.speed !== 0) {
      rowData.obstacles.forEach(obs => {
        obs.x += rowData.speed;

        if (rowData.speed > 0 && obs.x > canvas.width + 200) obs.x = -obs.width - 100;
        else if (rowData.speed < 0 && obs.x + obs.width < -200) obs.x = canvas.width + 100;

        if (r === player.row) {
          const overlap = player.worldX < obs.x + obs.width && player.worldX + GRID_SIZE > obs.x;
          if (rowData.type === 'WATER' && overlap) {
            onPlatform = true;
            player.worldX += rowData.speed;
            player.col = Math.round(player.worldX / GRID_SIZE);
          } else if (rowData.type === 'ROAD' && overlap) {
            playCrashSound();
            triggerGameOver();
          }
        }
      });
    }
  }

  if (currentRow.type === 'WATER' && !onPlatform) {
    playSplashSound();
    triggerGameOver();
  }

  if (player.worldX < 0 || player.worldX + GRID_SIZE > canvas.width) {
    playSplashSound();
    triggerGameOver();
  }
}

function triggerGameOver() {
  gameOver = true;
}

function restartGame() {
  score = 0; maxRow = 0; cameraY = 0; gameOver = false; isNewHighScore = false;
  generatedRows.clear(); lastChunkType = 'SAFE'; currentChunkLength = 5;
  player.reset();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const minVisibleRow = Math.max(0, Math.floor(cameraY / GRID_SIZE) - 2);
  const maxVisibleRow = minVisibleRow + Math.ceil(canvas.height / GRID_SIZE) + 3;

  // 1. Terrain Rows
  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    const screenY = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;

    if (rowData.type === 'SAFE') {
      ctx.fillStyle = (r % 2 === 0) ? '#f1f5f9' : '#e2e8f0';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE + 1);
    } else if (rowData.type === 'WATER') {
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE + 1);
    } else if (rowData.type === 'ROAD') {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, screenY, canvas.width, GRID_SIZE + 1);
    }
  }

  // 2. High-Detail SVG Obstacles
  for (let r = minVisibleRow; r <= maxVisibleRow; r++) {
    const rowData = getOrCreateRow(r);
    const screenY = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;

    rowData.obstacles.forEach(obs => {
      if (rowData.type === 'WATER') {
        ctx.drawImage(iceFloeImg, obs.x, screenY - 4, obs.width, GRID_SIZE + 8);
      } else if (rowData.type === 'ROAD') {
        ctx.save();
        if (rowData.speed < 0) {
          ctx.translate(obs.x + obs.width, screenY);
          ctx.scale(-1, 1);
          ctx.drawImage(shipImg, 0, -4, obs.width, GRID_SIZE + 8);
        } else {
          ctx.drawImage(shipImg, obs.x, screenY - 4, obs.width, GRID_SIZE + 8);
        }
        ctx.restore();
      }
    });
  }

  // 3. Player Penguin
  const playerScreenX = player.worldX;
  const playerScreenY = canvas.height - (player.worldY - cameraY) - GRID_SIZE;
  ctx.drawImage(penguinImg, playerScreenX, playerScreenY, GRID_SIZE, GRID_SIZE);

  // 4. Update HUD Text
  document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
  document.getElementById('highScoreDisplay').innerText = `BEST: ${highScore}`;

  // 5. Game Over Screen Overlay
  if (gameOver) {
    ctx.fillStyle = 'rgba(12, 20, 39, 0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ef4444';
    ctx.font = '800 32px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.4);

    if (isNewHighScore) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = '700 22px system-ui, sans-serif';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, canvas.height * 0.48);
    }

    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 18px system-ui, sans-serif';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height * (isNewHighScore ? 0.54 : 0.48));
    ctx.fillText('TAP ANYWHERE TO RESTART', canvas.width / 2, canvas.height * 0.62);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
