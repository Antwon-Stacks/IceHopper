<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ice Hopper - GlacierPlay</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0c1427; font-family: system-ui, -apple-system, sans-serif; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; }
    
    /* UI Overlays */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: rgba(12, 20, 39, 0.88); backdrop-filter: blur(8px); transition: opacity 0.3s; }
    .hidden { opacity: 0; pointer-events: none; }
    
    h1 { font-size: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(135deg, #e0f2fe, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(56, 189, 248, 0.4)); }
    .stats { color: #f8fafc; font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; line-height: 1.5; }
    .stats span { color: #f59e0b; }
    .stats .fish { color: #38bdf8; }
    
    button { background: linear-gradient(to bottom, #38bdf8, #0284c7); border: none; border-radius: 30px; padding: 14px 36px; color: white; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5); cursor: pointer; transition: transform 0.1s; margin-bottom: 12px; width: 230px; }
    button:active { transform: scale(0.95); }
    button.alt { background: linear-gradient(to bottom, #475569, #1e293b); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
    
    /* In-Game HUD */
    .hud { position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px; display: flex; justify-content: space-between; padding: 10px 18px; background: rgba(12, 20, 39, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: white; font-weight: 800; z-index: 10; pointer-events: none; }
    .hud-left { display: flex; gap: 15px; }
    .hud-fish { color: #38bdf8; }
    .powerup-bar { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; display: none; z-index: 10; }
    .powerup-fill { height: 100%; background: #f59e0b; width: 100%; transition: width 0.1s linear; }

    /* Shop UI */
    #shop, #leaderboard { display: none; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; overflow-y: auto; padding: 20px; }
    .shop-section { width: 310px; margin-bottom: 15px; }
    .shop-section-title { color: #94a3b8; font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
    .shop-card { background: #1e293b; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border: 2px solid transparent; width: 100%; }
    .shop-card.active { border-color: #38bdf8; }
    .shop-info { color: white; font-weight: bold; font-size: 15px; }
    .shop-sub { color: #94a3b8; font-size: 11px; font-weight: normal; margin-top: 2px; }
    .shop-cost { color: #38bdf8; font-size: 13px; font-weight: 800; margin-top: 2px; }
    .shop-btn { width: auto; padding: 8px 16px; font-size: 12px; margin: 0; }
    .shop-status { color: #10b981; font-size: 12px; font-weight: 800; }

    /* Leaderboard UI */
    .lb-container { width: 310px; background: #1e293b; border-radius: 16px; padding: 10px 16px; margin-bottom: 20px; }
    .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); color: white; font-weight: bold; font-size: 15px; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { width: 30px; color: #f59e0b; font-weight: 900; }
    .lb-name { flex-grow: 1; text-align: left; }
    .lb-score { color: #38bdf8; }
    .lb-row.you { color: #f59e0b; }
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="startMenu" class="overlay">
    <h1>Ice Hopper</h1>
    <div class="stats">
      BEST SCORE: <span id="menuBest">0</span><br>
      FISH VAULT: <span class="fish" id="menuFish">0</span> 🐟
    </div>
    <button onclick="startGame()">Tap to Hop</button>
    <button class="alt" onclick="openShop()">Shop</button>
    <button class="alt" onclick="openLeaderboard()">Leaderboard</button>
  </div>

  <!-- Shop Menu -->
  <div id="shop" class="overlay">
    <h1 style="font-size: 28px;">Shop</h1>
    <div class="stats">VAULT: <span class="fish" id="shopFish">0</span> 🐟</div>
    
    <div class="shop-section">
      <div class="shop-section-title">Unlock Power-Ups</div>
      <div id="powerupList"></div>
    </div>

    <div class="shop-section">
      <div class="shop-section-title">Character Skins</div>
      <div id="skinList"></div>

  </div>

  <div id="leaderboard" class="overlay">

    <button class="alt" onclick="closeLeaderboard()">Back</button>
  </div>

  <!-- In-Game HUD -->
  <div class="hud" id="gameHud" style="opacity: 0;">
    <div class="hud-left">
      <div>SCORE: <span id="scoreDisplay">0</span></div>
      <div class="hud-fish" id="fishDisplay">🐟 0</div>
    </div>
    <div id="statusDisplay"></div>
  </div>
  <div class="powerup-bar" id="powerupBar"><div class="powerup-fill" id="powerupFill"></div></div>

  <canvas id="gameCanvas"></canvas>

<script>
// --- LOCAL STORAGE & PROGRESSION ---
const KEY_HIGH = 'glacierplay_icehopper_high';
const KEY_FISH = 'glacierplay_icehopper_fish';
const KEY_SKINS = 'glacierplay_icehopper_skins';
const KEY_EQUIP = 'glacierplay_icehopper_equip';
const KEY_UNLOCK_SHIELD = 'glacierplay_icehopper_unlock_shield';
const KEY_UNLOCK_SARDINE = 'glacierplay_icehopper_unlock_sardine';
const KEY_LEADERBOARD = 'glacierplay_icehopper_leaderboard';

let highScore = parseInt(localStorage.getItem(KEY_HIGH)) || 0;
let fishCoins = parseInt(localStorage.getItem(KEY_FISH)) || 0;
let unlockedSkins = JSON.parse(localStorage.getItem(KEY_SKINS)) || ['default'];
let currentSkin = localStorage.getItem(KEY_EQUIP) || 'default';

let unlockShield = localStorage.getItem(KEY_UNLOCK_SHIELD) === 'true';
let unlockSardine = localStorage.getItem(KEY_UNLOCK_SARDINE) === 'true';

let defaultLeaderboard = [
  { name: 'FrostyKing', score: 1200 },
  { name: 'PuffinPro', score: 850 },
  { name: 'IceHopper99', score: 600 },
  { name: 'SnowyPenguin', score: 400 },
  { name: 'You', score: highScore }
];

let leaderboardData = JSON.parse(localStorage.getItem(KEY_LEADERBOARD)) || defaultLeaderboard;

function saveProgress() {
  localStorage.setItem(KEY_HIGH, highScore);
  localStorage.setItem(KEY_FISH, fishCoins);
  localStorage.setItem(KEY_SKINS, JSON.stringify(unlockedSkins));
  localStorage.setItem(KEY_EQUIP, currentSkin);
  localStorage.setItem(KEY_UNLOCK_SHIELD, unlockShield);
  localStorage.setItem(KEY_UNLOCK_SARDINE, unlockSardine);
  
  updateLeaderboardData(highScore);
  localStorage.setItem(KEY_LEADERBOARD, JSON.stringify(leaderboardData));

  // UPDATE ALL FISH VAULT COUNTERS ON SCREEN IMMEDIATELY
  const menuBestEl = document.getElementById('menuBest');
  const menuFishEl = document.getElementById('menuFish');
  const shopFishEl = document.getElementById('shopFish');
  if (menuBestEl) menuBestEl.innerText = highScore;
  if (menuFishEl) menuFishEl.innerText = fishCoins;
  if (shopFishEl) shopFishEl.innerText = fishCoins;
}

function updateLeaderboardData(userScore) {
  let youEntry = leaderboardData.find(entry => entry.name === 'You');
  if (youEntry) {
    if (userScore > youEntry.score) youEntry.score = userScore;
  } else {
    leaderboardData.push({ name: 'You', score: userScore });
  }
  leaderboardData.sort((a, b) => b.score - a.score);
  leaderboardData = leaderboardData.slice(0, 5);
}

saveProgress();

function checkAndUpdateHighScore(currentScore) {
  if (currentScore > highScore) {
    highScore = currentScore;
    saveProgress();
    if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
      window.GlacierPlay.onScoreUpdate(currentScore, highScore);
    }
  }
}

// SKINS CONFIGURATION
const SKINS = [
  { id: 'default', name: 'Classic', cost: 0 },
  { id: 'puffin', name: 'Atlantic Puffin', cost: 50 },
  { id: 'seal', name: 'Harbor Seal', cost: 120 }
];

// --- AUDIO & HAPTICS ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function playSound(type) {
  initAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'hop') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1); vibrate(10);
  } else if (type === 'coin') {
    osc.type = 'square'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1200, t + 0.05);
    gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    osc.start(t); osc.stop(t + 0.15); vibrate([10, 30, 10]);
  } else if (type === 'powerup') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t + 0.3);
    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3); vibrate(50);
  } else if (type === 'crash' || type === 'splash') {
    osc.type = type === 'crash' ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t); osc.stop(t + 0.3); vibrate(80);
  } else if (type === 'orca') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.6);
    gain.gain.setValueAtTime(0.4, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.6);
    osc.start(t); osc.stop(t + 0.6); vibrate([60, 40, 120]);
  }
}

// --- ENGINE & CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let GRID_SIZE = 50, COLS = 10;

function resize() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  GRID_SIZE = canvas.width / COLS;
}
window.addEventListener('resize', resize); resize();

let gameState = 'START'; 
let score = 0, maxRow = 2, cameraY = 0, autoScrollSpeed = 0;
let particles = [];
let powerupTimer = 0;
let hasShield = false;
let invulnerabilityTimer = 0;
let orcaBiteAnimation = null;

// --- CLASSES ---
class Player {
  constructor() { this.reset(); }
  reset() {
    this.col = 4; this.row = 2;
    this.x = this.col * GRID_SIZE; this.y = this.row * GRID_SIZE;
    this.animX = this.x; this.animY = this.y;
    this.hopT = 1; this.isDead = false;
  }
  hop(dCol, dRow) {
    if (this.hopT < 0.8 || this.isDead) return;
    this.col = Math.max(0, Math.min(COLS - 1, this.col + dCol));
    this.row = Math.max(0, this.row + dRow);
    this.x = this.col * GRID_SIZE;
    this.y = this.row * GRID_SIZE;
    this.hopT = 0;
    playSound('hop');
    spawnParticles(this.animX + GRID_SIZE/2, canvas.height - (this.animY - cameraY), '#e2e8f0', 5);
    
    if (this.row > maxRow) {
      maxRow = this.row; 
      score = (maxRow - 2) * 10;
      checkAndUpdateHighScore(score);
      updateHUD(); 
    }
  }
  update(dt) {
    if (this.hopT < 1) {
      this.hopT += dt * 6;
      if (this.hopT > 1) this.hopT = 1;
      this.animX += (this.x - this.animX) * 0.4;
      this.animY += (this.y - this.animY) * 0.4;
    } else {
      this.animX = this.x; this.animY = this.y;
    }
  }
  
  draw(ctx, screenY) {
    if (this.isDead) return;
    const skin = SKINS.find(s => s.id === currentSkin);
    const cx = this.animX + GRID_SIZE / 2;
    const cy = screenY + GRID_SIZE / 2;
    
    if (invulnerabilityTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

    if (powerupTimer > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, GRID_SIZE*0.75, 0, Math.PI*2);
      ctx.fillStyle = `rgba(245, 158, 11, ${0.4 + Math.sin(Date.now()/50)*0.2})`; ctx.fill();
    } else if (hasShield) {
      ctx.beginPath(); ctx.arc(cx, cy, GRID_SIZE*0.65, 0, Math.PI*2);
      ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = 'rgba(125, 211, 252, 0.2)'; ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, cy);
    
    if (this.hopT < 1) {
      const arc = Math.sin(this.hopT * Math.PI);
      ctx.translate(0, -arc * (GRID_SIZE * 0.4));
      ctx.scale(1 - arc * 0.15, 1 + arc * 0.2);
    }

    // --- CHARACTER SKINS ---
    if (skin.id === 'seal') {
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0, 16, 16, 5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#475569';
      ctx.beginPath(); ctx.ellipse(-15, 6, 6, 12, 0.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, 6, 6, 12, -0.6, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.ellipse(0, 2, 16, 18, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.ellipse(0, 5, 11, 12, 0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(-6, 2, 1.5, 0, Math.PI*2); ctx.arc(7, 8, 2, 0, Math.PI*2); ctx.arc(-8, 10, 1.5, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#f1f5f9'; ctx.beginPath(); ctx.ellipse(-4, -2, 5, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(4, -2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(0, -4, 4, 2.5, 0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.ellipse(-6, -5, 7, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(6, -5, 7, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0, 6, 10, 8, 0, 0, Math.PI*2); ctx.fill();

    }

}

const player = new Player();
const generatedRows = new Map();

function getOrCreateRow(r) {
  if (generatedRows.has(r)) return generatedRows.get(r);

  const diff = Math.min(1, maxRow / 120); 
  let type = 'SAFE', speed = 0, obstacles = [], items = [];

  if (r > 3) {
    const rand = Math.random();
    if (r < 10) type = rand < 0.5 ? 'ROAD' : 'SAFE'; 
    else if (r < 30) type = rand < 0.35 ? 'ROAD' : (rand < 0.7 ? 'WATER' : 'SAFE'); 
    else type = rand < 0.35 ? 'ROAD' : (rand < 0.75 ? 'WATER' : 'SAFE'); 

    if (type !== 'SAFE') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      speed = dir * (1.0 + Math.random() * 1.2) * (1 + diff * 0.6); 
      const isOrca = type === 'WATER' && diff > 0.4 && Math.random() < 0.25; 
      const width = (Math.floor(Math.random() * 2) + 2) * GRID_SIZE;
      const minGap = width + (GRID_SIZE * 3.5); 

      let currentX = -100;
      while (currentX < canvas.width + 400) {
        obstacles.push({ 
          x: currentX, 
          width: width, 
          isMelting: type === 'WATER' && !isOrca && diff > 0.3 && Math.random() < 0.25, 
          meltTimer: 0, 
          isOrca,
          diveTimer: 0 
        });
        currentX += minGap + Math.random() * (GRID_SIZE * 2.5);
      }
    }

    if (Math.random() < 0.2) {
      const ix = Math.floor(Math.random() * COLS) * GRID_SIZE;
      const allowedItems = ['FISH'];
      if (unlockShield) allowedItems.push('SHIELD');
      if (unlockSardine) allowedItems.push('SARDINE');

      const chosenType = allowedItems[Math.floor(Math.random() * allowedItems.length)];
      items.push({ x: ix, type: chosenType, collected: false });
    }
  }

  const rowData = { r, type, speed, obstacles, items };
  generatedRows.set(r, rowData);
  return rowData;
}

function spawnParticles(x, y, color, count) {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 2,
      life: 1, color, size: Math.random()*4 + 2
    });
  }
}

let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => { initAudio(); touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive: false});
window.addEventListener('touchend', e => {
  if (gameState !== 'PLAY') return;
  const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) player.hop(dx > 0 ? 1 : -1, 0); else player.hop(0, dy < 0 ? 1 : -1);
}, {passive: false});
window.addEventListener('keydown', e => {
  if (gameState !== 'PLAY') return;
  if(e.key==='ArrowUp'||e.key==='w') player.hop(0,1); if(e.key==='ArrowDown'||e.key==='s') player.hop(0,-1);
  if(e.key==='ArrowLeft'||e.key==='a') player.hop(-1,0); if(e.key==='ArrowRight'||e.key==='d') player.hop(1,0);
});

function unlockPowerup(type) {
  if (type === 'shield' && !unlockShield && fishCoins >= 30) {
    fishCoins -= 30; unlockShield = true; playSound('powerup');
  } else if (type === 'sardine' && !unlockSardine && fishCoins >= 60) {
    fishCoins -= 60; unlockSardine = true; playSound('powerup');
  } else {
    vibrate([50, 50, 50]); return;
  }
  saveProgress(); renderShop();
}

function buySkin(id) {
  const skin = SKINS.find(s => s.id === id);
  if (!unlockedSkins.includes(id)) {
    if (fishCoins >= skin.cost) { fishCoins -= skin.cost; unlockedSkins.push(id); currentSkin = id; playSound('coin'); }
    else { vibrate([50, 50, 50]); return; } 
  } else { currentSkin = id; }
  saveProgress(); renderShop();
}

function triggerGameOver() {
  gameState = 'OVER'; player.isDead = true; saveProgress();
  setTimeout(() => { document.getElementById('startMenu').classList.remove('hidden'); document.getElementById('gameHud').style.opacity = 0; }, 1200);
}

function updateHUD() {

function triggerShieldBreak(obs, screenY) {
  hasShield = false;
  invulnerabilityTimer = 1.5;
  if (obs) obs.x = -2000;
  playSound('powerup');
  spawnParticles(player.animX + GRID_SIZE/2, screenY + GRID_SIZE/2, '#7dd3fc', 20);
  updateHUD();
}

function triggerOrcaEaten(screenY) {
  orcaBiteAnimation = { x: player.animX, y: screenY, progress: 0 };
  playSound('orca');
  spawnParticles(player.animX + GRID_SIZE/2, screenY + GRID_SIZE/2, '#0f172a', 15);
  spawnParticles(player.animX + GRID_SIZE/2, screenY + GRID_SIZE/2, '#ef4444', 12);
  triggerGameOver();
}

// --- MAIN LOOP ---
let lastTime = performance.now();
function loop(time) {
  const dt = (time - lastTime) / 1000; lastTime = time;
  
  if (gameState === 'PLAY') {
    player.update(dt);
    if (invulnerabilityTimer > 0) invulnerabilityTimer -= dt;

    autoScrollSpeed = 0.15 + Math.min(score / 3000, 0.4);
    cameraY += autoScrollSpeed;
    const targetCam = player.animY - canvas.height * 0.45;
    if (targetCam > cameraY) cameraY += (targetCam - cameraY) * 0.1;

    const screenY = canvas.height - (player.animY - cameraY) - GRID_SIZE;
    if (screenY > canvas.height + 25) { 
      if (hasShield) { triggerShieldBreak(null, screenY); player.hop(0, 1); }
      else triggerOrcaEaten(canvas.height - GRID_SIZE);
      return;
    }

    if (powerupTimer > 0) {
      powerupTimer -= dt;
      document.getElementById('powerupBar').style.display = 'block';
      document.getElementById('powerupFill').style.width = `${(powerupTimer/5)*100}%`;
      spawnParticles(player.animX + GRID_SIZE/2, screenY + GRID_SIZE, '#f59e0b', 1); 
      if (powerupTimer <= 0) document.getElementById('powerupBar').style.display = 'none';
    }

    let onPlatform = false;
    const curRow = getOrCreateRow(player.row);

    for (let r = Math.floor(cameraY / GRID_SIZE) - 2; r <= Math.ceil(canvas.height / GRID_SIZE) + Math.floor(cameraY / GRID_SIZE) + 2; r++) {
      const row = getOrCreateRow(r);
      
      row.items.forEach(item => {
        if (!item.collected && r === player.row && Math.abs(player.animX - item.x) < GRID_SIZE/2) {
          item.collected = true;
          if (item.type === 'FISH') { fishCoins++; score+=10; playSound('coin'); spawnParticles(item.x, canvas.height - (r*GRID_SIZE-cameraY), '#38bdf8', 5); }
          else if (item.type === 'SARDINE') { powerupTimer = 5; playSound('powerup'); }
          else if (item.type === 'SHIELD') { hasShield = true; playSound('powerup'); }
          updateHUD();
        }
      });

      if (row.speed !== 0 && row.obstacles.length > 0) {
        row.obstacles.forEach(obs => { obs.x += row.speed; });

        const minGap = GRID_SIZE * 3.5;
        if (row.speed > 0) {
          row.obstacles.forEach(obs => {
            if (obs.x > canvas.width + 150) {
              let minX = Math.min(...row.obstacles.map(o => o.x));
              obs.x = Math.min(-obs.width - 50, minX - minGap);
              obs.meltTimer = 0; obs.diveTimer = 0;
            }
          });
        } else {
          row.obstacles.forEach(obs => {
            if (obs.x + obs.width < -150) {
              let maxX = Math.max(...row.obstacles.map(o => o.x + o.width));
              obs.x = Math.max(canvas.width + 50, maxX + minGap);
              obs.meltTimer = 0; obs.diveTimer = 0;
            }
          });
        }

        row.obstacles.forEach(obs => {
          const overlap = player.animX < obs.x + obs.width - 10 && player.animX + GRID_SIZE > obs.x + 10;

          if (r === player.row) {
            if (row.type === 'WATER' && overlap) {
              if (obs.isOrca) {
                // RIDEABLE ORCA MECHANIC
                onPlatform = true;
                player.x += row.speed; player.animX += row.speed; player.col = Math.round(player.x / GRID_SIZE);

                if (player.hopT === 1) {
                  obs.diveTimer = (obs.diveTimer || 0) + dt;
                  
                  // 1.5-Second Dive Timer Expiration check
                  if (obs.diveTimer >= 1.5) {
                    if (powerupTimer > 0) {
                      // Invincibility protection
                    } else if (hasShield) {
                      triggerShieldBreak(obs, screenY);
                      player.hop(0, 1);
                      obs.diveTimer = 0;
                    } else {
                      triggerOrcaEaten(screenY);
                    }
                  }
                }
              } else {
                onPlatform = true;
                player.x += row.speed; player.animX += row.speed; player.col = Math.round(player.x / GRID_SIZE);
                if (obs.isMelting && player.hopT === 1) obs.meltTimer += dt;
              }
            } else if (row.type === 'ROAD' && overlap) {
              if (powerupTimer > 0) { obs.x = -2000; spawnParticles(player.animX, screenY, '#f8fafc', 15); playSound('crash'); }
              else if (invulnerabilityTimer > 0) { /* grace */ }
              else if (hasShield) triggerShieldBreak(obs, screenY);
              else { playSound('crash'); spawnParticles(player.animX, screenY, '#ef4444', 20); triggerGameOver(); }
            }
          }

          // Reset Orca dive timer if player is not riding it
          if (obs.isOrca && (!overlap || r !== player.row)) {
            obs.diveTimer = 0;
          }

          if (obs.isMelting && obs.meltTimer > 2.2) obs.x = -1000; 
        });
      }
    }

    if (powerupTimer > 0 && curRow.type === 'WATER') onPlatform = true;

    if (curRow.type === 'WATER' && !onPlatform && player.hopT === 1 && invulnerabilityTimer <= 0) { 
      if (hasShield) { triggerShieldBreak(null, screenY); player.hop(0, 1); }
      else triggerOrcaEaten(screenY);
    }

    if ((player.animX < -GRID_SIZE/2 || player.animX > canvas.width - GRID_SIZE/2) && invulnerabilityTimer <= 0) { 
      if (hasShield) { triggerShieldBreak(null, screenY); player.col = 4; player.x = 4*GRID_SIZE; }
      else triggerOrcaEaten(screenY);
    }
  }

  // --- RENDER VISUALS ---
  const cycle = (maxRow / 100) % 1;
  let bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  if (cycle < 0.3) { bgGrad.addColorStop(0, '#38bdf8'); bgGrad.addColorStop(1, '#e0f2fe'); }
  else if (cycle < 0.6) { bgGrad.addColorStop(0, '#f43f5e'); bgGrad.addColorStop(1, '#fcd34d'); }
  else if (cycle < 0.8) { bgGrad.addColorStop(0, '#0f172a'); bgGrad.addColorStop(1, '#312e81'); }
  else { bgGrad.addColorStop(0, '#064e3b'); bgGrad.addColorStop(1, '#10b981'); } 
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const minR = Math.max(0, Math.floor(cameraY / GRID_SIZE) - 1);
  const maxR = minR + Math.ceil(canvas.height / GRID_SIZE) + 2;

  for (let r = minR; r <= maxR; r++) {
    const row = getOrCreateRow(r);
    const sy = canvas.height - (r * GRID_SIZE - cameraY) - GRID_SIZE;
    
    if (row.type === 'SAFE') { 
        ctx.fillStyle = (r%2===0)?'#f1f5f9':'#e2e8f0'; ctx.fillRect(0, sy, canvas.width, GRID_SIZE+1); 
    } else if (row.type === 'ROAD') { 
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, sy, canvas.width, GRID_SIZE+1); 
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([12, 12]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, sy + GRID_SIZE/2); ctx.lineTo(canvas.width, sy + GRID_SIZE/2); ctx.stroke();
        ctx.setLineDash([]);
    } else if (row.type === 'WATER') { 
        ctx.fillStyle = '#0284c7'; ctx.fillRect(0, sy, canvas.width, GRID_SIZE+1); 
    }

    ctx.font = `${GRID_SIZE*0.6}px sans-serif`; ctx.textAlign = 'center';
    row.items.forEach(i => {
      if (!i.collected) {
        const floatY = Math.sin(Date.now()/200)*3;
        ctx.fillText(i.type==='FISH'?'🐟':(i.type==='SARDINE'?'🌟':'🛡️'), i.x + GRID_SIZE/2, sy + GRID_SIZE*0.7 + floatY);
      }
    });

    row.obstacles.forEach(obs => {
      if (row.type === 'WATER') {
        if (obs.isOrca) {
          ctx.save();

          // Submerge dipping effect when dive timer active
          const dip = obs.diveTimer ? (obs.diveTimer / 1.5) * 12 : 0;

          if (row.speed < 0) {
            ctx.translate(obs.x + obs.width, sy + dip);
            ctx.scale(-1, 1);
            ctx.drawImage(orcaImg, 0, -6, obs.width, GRID_SIZE + 12);
          } else {
            ctx.drawImage(orcaImg, obs.x, sy - 6 + dip, obs.width, GRID_SIZE + 12);
          }
          ctx.restore();

          // 1.5-SECOND DIVE TIMER INDICATOR OVER ORCA
          if (obs.diveTimer > 0) {
            const timeLeft = Math.max(0, 1.5 - obs.diveTimer).toFixed(1);
            const timerX = obs.x + obs.width / 2;
            const timerY = sy - 10;

            ctx.fillStyle = obs.diveTimer > 0.8 ? '#ef4444' : '#f59e0b';
            ctx.font = '900 16px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`⚠️ ${timeLeft}s`, timerX, timerY);
          }

        } else {
          ctx.globalAlpha = obs.isMelting ? Math.max(0, 1 - (obs.meltTimer/2.2)) : 1;
          if (obs.isMelting && Math.random()<0.2) ctx.translate((Math.random()-0.5)*4, 0); 
          ctx.drawImage(iceImg, obs.x, sy, obs.width, GRID_SIZE);
          ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
        }
      } else if (row.type === 'ROAD') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        if (row.speed > 0) {
          ctx.moveTo(obs.x, sy + GRID_SIZE * 0.35); ctx.lineTo(obs.x - 22, sy + GRID_SIZE * 0.2);
          ctx.lineTo(obs.x - 22, sy + GRID_SIZE * 0.8); ctx.lineTo(obs.x, sy + GRID_SIZE * 0.65);
        } else {
          ctx.moveTo(obs.x + obs.width, sy + GRID_SIZE * 0.35); ctx.lineTo(obs.x + obs.width + 22, sy + GRID_SIZE * 0.2);
          ctx.lineTo(obs.x + obs.width + 22, sy + GRID_SIZE * 0.8); ctx.lineTo(obs.x + obs.width, sy + GRID_SIZE * 0.65);
        }
        ctx.closePath(); ctx.fill();

        ctx.save();
        if (row.speed < 0) { ctx.translate(obs.x + obs.width, sy); ctx.scale(-1, 1); ctx.drawImage(shipImg, 0, -4, obs.width, GRID_SIZE + 8); }
        else { ctx.drawImage(shipImg, obs.x, sy - 4, obs.width, GRID_SIZE + 8); }
        ctx.restore();
      }
    });
  }

  player.draw(ctx, canvas.height - (player.animY - cameraY) - GRID_SIZE);

  // HEAVY BREACHING ORCA DEATH ANIMATION
  if (orcaBiteAnimation) {
    orcaBiteAnimation.progress += dt * 2.2;
    const ox = orcaBiteAnimation.x + GRID_SIZE / 2;
    const oy = orcaBiteAnimation.y + GRID_SIZE / 2;
    const p = Math.min(1, orcaBiteAnimation.progress);

    const archY = Math.sin(p * Math.PI) * (GRID_SIZE * 1.5);
    const archAngle = (-Math.PI / 4) + (p * (Math.PI * 0.65));

    ctx.save();
    ctx.translate(ox, oy + GRID_SIZE * 0.2 - archY);
    ctx.rotate(archAngle);

    const breachWidth = GRID_SIZE * 2.3;
    const breachHeight = GRID_SIZE * 1.8;
    ctx.drawImage(orcaBreachImg, -breachWidth * 0.3, -breachHeight * 0.5, breachWidth, breachHeight);

    ctx.restore();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.ellipse(ox, oy + GRID_SIZE * 0.4, GRID_SIZE * (0.5 + p * 0.5), GRID_SIZE * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    if (p < 0.3 || p > 0.7) {
      spawnParticles(ox, oy + 10, '#ffffff', 3);
      spawnParticles(ox, oy + 10, '#38bdf8', 2);
    }
  }
  
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life -= dt*2;
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  });
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
