<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ice Hopper - Modern Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #0c1427;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 480px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .hud #highScoreDisplay { color: #f59e0b; }
    canvas {
      border: 3px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
      background-color: #0284c7;
      width: 90vw;
      height: 90vw;
      max-width: 480px;
      max-height: 480px;
    }
    .instructions { margin-top: 10px; color: #94a3b8; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Ice Hopper</h1>
  <div class="hud">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="highScoreDisplay">BEST: 0</div>
    <div id="livesDisplay">LIVES: 3</div>
  </div>

  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <div class="instructions">SWIPE anywhere to hop</div>

<script>
// --- HIGH SCORE & GLACIERPLAY BRIDGE ---
const STORAGE_KEY = 'glacierplay_ice_hopper_highscore';
let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
let isNewHighScore = false;

function checkAndUpdateHighScore(currentScore) {
  if (currentScore > highScore) {
    highScore = currentScore;
    isNewHighScore = true;
    localStorage.setItem(STORAGE_KEY, highScore);

    if (window.GlacierPlay && typeof window.GlacierPlay.onScoreUpdate === 'function') {
      window.GlacierPlay.onScoreUpdate(currentScore, highScore);
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'GLACIERPLAY_SCORE', game: 'ice_hopper', score: currentScore, highScore: highScore }, '*');
    }
  }
}

// --- WEB AUDIO SYNTHESIZER ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHopSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(480, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function playSplashSound() {
  initAudio();
  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playCrashSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

function playWinSound() {
  initAudio();
  const notes = [261.63, 329.63, 392.00, 523.25];
  notes.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const startTime = audioCtx.currentTime + (idx * 0.09);
    gain.gain.setValueAtTime(0.2, startTime);
    gain.gain.linearRampToValueAtTime(0.01, startTime + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime + 0.12);
  });
}

// --- VECTOR RENDERERS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 50;
let score = 0;
let lives = 3;
let gameOver = false;
let gameWon = false;

const player = {
  x: 4 * GRID_SIZE,
  y: 9 * GRID_SIZE,
  reset() { this.x = 4 * GRID_SIZE; this.y = 9 * GRID_SIZE; }
};

function drawPenguin(x, y) {
  const cx = x + GRID_SIZE / 2;
  const cy = y + GRID_SIZE / 2;

  // Drop Shadow
  ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 18, 16, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Feet
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.ellipse(cx - 8, cy + 16, 5, 3, -0.2, 0, Math.PI * 2);
  ctx.ellipse(cx + 8, cy + 16, 5, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Body Gradient (Dark Navy to Slate)
  const bodyGrad = ctx.createLinearGradient(cx, cy - 20, cx, cy + 16);
  bodyGrad.addColorStop(0, '#1e293b');
  bodyGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 17, 19, 0, 0, Math.PI * 2);
  ctx.fill();

  // Flippers
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.ellipse(cx - 16, cy + 2, 4, 10, 0.3, 0, Math.PI * 2);
  ctx.ellipse(cx + 16, cy + 2, 4, 10, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Belly Patch
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 3, 11, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(cx - 5, cy - 6, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 5, cy - 6, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Eye Shines
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 7, 1, 0, Math.PI * 2);
  ctx.arc(cx + 4, cy - 7, 1, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#fb923c';
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy - 3);
  ctx.lineTo(cx + 4, cy - 3);
  ctx.lineTo(cx, cy + 3);
  ctx.closePath();
  ctx.fill();
}

function drawIceFloe(x, y, width) {
  const height = 36;
  const padY = y + 7;

  // Underwater Ice Mass (Depth Effect)
  ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
  ctx.beginPath();
  ctx.roundRect(x - 2, padY + 4, width + 4, height, 12);
  ctx.fill();

  // Surface Ice Gradient
  const iceGrad = ctx.createLinearGradient(x, padY, x, padY + height);
  iceGrad.addColorStop(0, '#ffffff');
  iceGrad.addColorStop(0.4, '#e0f2fe');
  iceGrad.addColorStop(1, '#bae6fd');
  ctx.fillStyle = iceGrad;
  ctx.beginPath();
  ctx.roundRect(x, padY, width, height, 10);
  ctx.fill();

  // Inner Gloss Highlight
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x + 3, padY + 3, width - 6, height - 6, 8);
  ctx.stroke();
}

function drawShip(x, y, width, dir) {
  const height = 32;
  const padY = y + 9;

  // Water Wake
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.beginPath();
  if (dir > 0) {
    ctx.ellipse(x - 8, padY + height / 2, 12, 6, 0, 0, Math.PI * 2);
  } else {
    ctx.ellipse(x + width + 8, padY + height / 2, 12, 6, 0, 0, Math.PI * 2);
  }
  ctx.fill();

  // Steel Hull
  const hullGrad = ctx.createLinearGradient(x, padY, x, padY + height);
  hullGrad.addColorStop(0, '#dc2626');
  hullGrad.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.roundRect(x, padY, width, height, [6, 14, 14, 6]);
  ctx.fill();

  // Containers Stacked on Deck
  const colors = ['#0284c7', '#eab308', '#059669', '#d97706'];
  const blockWidth = 18;
  let count = Math.floor((width - 24) / blockWidth);
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(x + 8 + (i * blockWidth), padY + 4, blockWidth - 3, height - 12);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.strokeRect(x + 8 + (i * blockWidth), padY + 4, blockWidth - 3, height - 12);
  }

  // Cabin / Bridge
  ctx.fillStyle = '#f8fafc';
  const cabinX = dir > 0 ? x + width - 18 : x + 4;
  ctx.fillRect(cabinX, padY + 2, 14, height - 8);
  ctx.fillStyle = '#38bdf8'; // Glowing window
  ctx.fillRect(cabinX + 3, padY + 5, 8, 5);
}

// --- OBSTACLE & GAME LOOP ---
class Obstacle {
  constructor(row, speed, lengthUnits, isPlatform = false) {
    this.row = row;
    this.y = row * GRID_SIZE;
    this.speed = speed;
    this.isPlatform = isPlatform;
    this.width = lengthUnits * GRID_SIZE;
    this.x = speed > 0 ? -this.width : canvas.width;
  }

  update() {
    this.x += this.speed;
    if (this.speed > 0 && this.x > canvas.width) this.x = -this.width;
    else if (this.speed < 0 && this.x + this.width < 0) this.x = canvas.width;
  }

  draw() {
    if (this.isPlatform) {
      drawIceFloe(this.x, this.y, this.width);
    } else {
      drawShip(this.x, this.y, this.width, this.speed);
    }
  }
}

const obstacles = [
  new Obstacle(7, 2, 2.5),      new Obstacle(7, 2, 2.5),
  new Obstacle(6, -2.5, 2),    new Obstacle(5, 3, 3),
  new Obstacle(3, 1.8, 2.5, true), new Obstacle(2, -2, 2, true), new Obstacle(1, 1.5, 3, true)
];

obstacles[0].x = 40;  obstacles[1].x = 290;
obstacles[2].x = 200; obstacles[3].x = 100;
obstacles[4].x = 100; obstacles[5].x = 260; obstacles[6].x = 50;

// --- SWIPE CONTROLS ---
let touchStartX = 0;
let touchStartY = 0;
const MIN_SWIPE_DIST = 25;

window.addEventListener('touchstart', (e) => {
  initAudio();
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: false });

window.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;

  const dx = touchEndX - touchStartX;
  const dy = touchEndY - touchStartY;

  if (gameOver || gameWon) {
    restartGame();
    return;
  }

  if (Math.abs(dx) < MIN_SWIPE_DIST && Math.abs(dy) < MIN_SWIPE_DIST) return;

  let moved = false;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && player.x < 9 * GRID_SIZE) { player.x += GRID_SIZE; moved = true; }
    else if (dx < 0 && player.x > 0) { player.x -= GRID_SIZE; moved = true; }
  } else {
    if (dy < 0 && player.y > 0) {
      player.y -= GRID_SIZE;
      score += 10;
      checkAndUpdateHighScore(score);
      moved = true;
    }
    else if (dy > 0 && player.y < 9 * GRID_SIZE) { player.y += GRID_SIZE; moved = true; }
  }

  if (moved) playHopSound();

  if (player.y === 0) {
    score += 500;
    checkAndUpdateHighScore(score);
    gameWon = true;
    playWinSound();
  }
}, { passive: false });

function update() {
  if (gameOver || gameWon) return;

  let playerOnPlatform = false;
  let currentRow = Math.floor(player.y / GRID_SIZE);

  obstacles.forEach(obs => {
    obs.update();
    if (obs.row === currentRow) {
      const overlap = player.x < obs.x + obs.width && player.x + GRID_SIZE > obs.x;
      if (obs.isPlatform && overlap) {
        playerOnPlatform = true;
        player.x += obs.speed;
      } else if (!obs.isPlatform && overlap) {
        playCrashSound();
        loseLife();
      }
    }
  });

  if (currentRow >= 1 && currentRow <= 3 && !playerOnPlatform) {
    playSplashSound();
    loseLife();
  }

  if (player.x < 0 || player.x + GRID_SIZE > canvas.width) {
    playSplashSound();
    loseLife();
  }
}

function loseLife() {
  lives--;
  player.reset();
  if (lives <= 0) gameOver = true;
}

function restartGame() {
  lives = 3; score = 0; gameOver = false; gameWon = false; isNewHighScore = false;
  player.reset();
}

function drawBackground() {
  // Northern Glacier Haven (Row 0)
  const glacierGrad = ctx.createLinearGradient(0, 0, 0, GRID_SIZE);
  glacierGrad.addColorStop(0, '#e0f2fe');
  glacierGrad.addColorStop(1, '#7dd3fc');
  ctx.fillStyle = glacierGrad;
  ctx.fillRect(0, 0, canvas.width, GRID_SIZE);

  // Arctic Ocean (Rows 1-3)
  const waterGrad = ctx.createLinearGradient(0, GRID_SIZE, 0, GRID_SIZE * 4);
  waterGrad.addColorStop(0, '#0284c7');
  waterGrad.addColorStop(1, '#0369a1');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, GRID_SIZE, canvas.width, GRID_SIZE * 3);

  // Safe Ridge (Row 4)
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, GRID_SIZE * 4, canvas.width, GRID_SIZE);

  // Shipping Lane (Rows 5-7)
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, GRID_SIZE * 5, canvas.width, GRID_SIZE * 3);

  // Starting Shore (Rows 8-9)
  const shoreGrad = ctx.createLinearGradient(0, GRID_SIZE * 8, 0, GRID_SIZE * 10);
  shoreGrad.addColorStop(0, '#f1f5f9');
  shoreGrad.addColorStop(1, '#cbd5e1');
  ctx.fillStyle = shoreGrad;
  ctx.fillRect(0, GRID_SIZE * 8, canvas.width, GRID_SIZE * 2);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  obstacles.forEach(obs => obs.draw());
  drawPenguin(player.x, player.y);

  document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
  document.getElementById('highScoreDisplay').innerText = `BEST: ${highScore}`;
  document.getElementById('livesDisplay').innerText = `LIVES: ${lives}`;

  if (gameOver || gameWon) {
    ctx.fillStyle = 'rgba(12, 20, 39, 0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = gameOver ? '#ef4444' : '#38bdf8';
    ctx.font = '800 28px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(gameOver ? 'GAME OVER' : 'VICTORY REACHED!', canvas.width / 2, 200);

    if (isNewHighScore) {
      ctx.fillStyle = '#f59e0b';
      ctx.font = '700 20px system-ui, sans-serif';
      ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, 245);
    }

    ctx.fillStyle = '#f8fafc';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, isNewHighScore ? 280 : 255);
    ctx.fillText('TAP ANYWHERE TO RESTART', canvas.width / 2, 320);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
